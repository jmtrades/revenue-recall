# Keep the free Render web service awake.
#
# Render's free plan sleeps a service after 15 minutes with no traffic. The
# in-process webinar scheduler lives in that process, so a sleeping app cannot
# place a drop-off call until the next request wakes it. This job pings
# /api/health every 10 minutes.
#
# GitHub Actions runs scheduled workflows only from the repository default
# branch, which is claude/build-universal-sales-system-RY33X. Merging into
# main does not start the schedule. The file has to be on that default branch.
# Until then, run it by hand with workflow_dispatch from any branch.
#
# The URL is the repo variable APP_URL when set, otherwise the live Render app.

name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          base="${APP_URL:-https://revenue-recall-relaunch.onrender.com}"
          url="${base%/}/api/health"
          echo "Pinging ${url}"
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 90 "$url"; then
              echo
              echo "health ok (attempt ${i})"
              ok=1
              break
            fi
            echo "attempt ${i} failed; sleeping 15s"
            sleep 15
          done
          test "$ok" = 1
